<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#f7f3ef">

<meta
    name="description"
    content="Beauty Studio — Reserva tu experiencia de belleza."
>

<title>Beauty Studio — Reserva</title>

<style>

/* =========================================================
   BEAUTY STUDIO
   PROGRESSIVE BOOKING EXPERIENCE
   ========================================================= */

:root{

    --bg:#f7f3ef;
    --bg-2:#fbf9f7;

    --white:#ffffff;

    --ink:#201b1b;
    --ink-soft:#403838;

    --muted:#827774;
    --muted-2:#a69b97;

    --rose:#b98282;
    --rose-dark:#9d6668;
    --rose-soft:#ead8d6;

    --champagne:#c7a274;
    --champagne-soft:#e8d5b7;

    --border:rgba(32,27,27,.09);

    --green:#718878;

    --shadow:
        0 24px 70px rgba(63,44,39,.09);

    --shadow-small:
        0 10px 30px rgba(63,44,39,.07);

    --radius-xl:32px;
    --radius-lg:24px;
    --radius-md:18px;
    --radius-sm:14px;

    --ease:cubic-bezier(.22,.61,.36,1);
}


/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    overflow-x:hidden;
}

body{

    margin:0;

    width:100%;
    min-width:0;

    overflow-x:hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(216,184,180,.18),
            transparent 27%
        ),
        radial-gradient(
            circle at 100% 12%,
            rgba(201,162,116,.13),
            transparent 25%
        ),
        var(--bg);

    color:var(--ink);

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

img{
    display:block;
    max-width:100%;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

::selection{
    background:var(--rose);
    color:#fff;
}


/* =========================================================
   GLOBAL
   ========================================================= */

.container{

    width:min(
        1160px,
        calc(100% - 40px)
    );

    margin:auto;
}

.section{
    padding:90px 0;
}

.eyebrow{

    display:inline-flex;
    align-items:center;
    gap:8px;

    color:var(--rose-dark);

    font-size:10px;
    font-weight:800;

    letter-spacing:.18em;

    text-transform:uppercase;
}

.eyebrow::before{

    content:"";

    width:22px;
    height:1px;

    background:var(--champagne);
}

.section-title{

    margin:15px 0 0;

    font-size:
        clamp(
            38px,
            6vw,
            64px
        );

    line-height:.98;

    letter-spacing:-.055em;

    font-weight:750;
}

.section-description{

    max-width:590px;

    margin:18px 0 0;

    color:var(--muted);

    font-size:15px;

    line-height:1.7;
}


/* =========================================================
   NAV
   ========================================================= */

.nav{

    position:fixed;

    z-index:1000;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    width:
        min(
            1120px,
            calc(100% - 24px)
        );

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:10px 12px 10px 18px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid
        rgba(255,255,255,.9);

    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    border-radius:999px;

    box-shadow:
        0 12px 35px
        rgba(55,38,34,.08);
}

.brand{

    display:flex;
    align-items:center;

    gap:10px;

    font-size:12px;
    font-weight:800;

    letter-spacing:.09em;
}

.brand-mark{

    width:31px;
    height:31px;

    display:grid;
    place-items:center;

    border-radius:50%;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #e4c9a5,
            #c29c6e
        );

    box-shadow:
        inset 0 1px 1px
        rgba(255,255,255,.8),

        0 7px 18px
        rgba(194,156,110,.2);
}

.nav-right{

    display:flex;
    align-items:center;

    gap:20px;
}

.nav-status{

    display:flex;
    align-items:center;
    gap:7px;

    color:var(--muted);

    font-size:10px;
}

.nav-status i{

    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 0 4px
        rgba(113,136,120,.1);
}

.nav-cta{

    border:0;

    padding:11px 18px;

    border-radius:999px;

    background:var(--ink);

    color:#fff;

    font-size:11px;
    font-weight:750;

    transition:.25s var(--ease);
}

.nav-cta:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 25px
        rgba(32,27,27,.16);
}


/* =========================================================
   HERO
   ========================================================= */

.hero{

    min-height:760px;

    display:flex;
    align-items:center;

    padding:
        145px
        0
        90px;

    overflow:hidden;

    position:relative;
}

.hero::before{

    content:"";

    position:absolute;

    width:550px;
    height:550px;

    top:-250px;
    left:-230px;

    background:
        radial-gradient(
            circle,
            rgba(216,184,180,.27),
            transparent 68%
        );

    filter:blur(18px);
}

.hero-grid{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:65px;

    align-items:center;
}

.hero-copy{
    position:relative;
    z-index:2;
}

.hero-pill{

    display:inline-flex;

    align-items:center;
    gap:8px;

    padding:9px 13px;

    border:
        1px solid
        rgba(157,102,104,.14);

    border-radius:999px;

    background:
        rgba(255,255,255,.62);

    color:var(--rose-dark);

    font-size:10px;
    font-weight:750;

    letter-spacing:.12em;
    text-transform:uppercase;
}

.hero-pill span{

    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--champagne);
}

.hero-title{

    margin:25px 0 0;

    font-size:
        clamp(
            52px,
            7vw,
            88px
        );

    line-height:.92;

    letter-spacing:-.07em;

    font-weight:750;
}

.hero-title em{

    font-family:Georgia,serif;

    font-weight:400;

    color:var(--rose-dark);
}

.hero-text{

    max-width:540px;

    margin:25px 0 0;

    color:var(--muted);

    font-size:16px;

    line-height:1.75;
}

.hero-actions{

    display:flex;
    flex-wrap:wrap;

    gap:11px;

    margin-top:30px;
}

.btn{

    min-height:49px;

    padding:
        0 21px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    border-radius:999px;

    font-size:11px;
    font-weight:750;

    transition:.25s var(--ease);
}

.btn-primary{

    background:var(--ink);

    color:white;

    border:1px solid var(--ink);
}

.btn-primary:hover{

    transform:translateY(-3px);

    box-shadow:
        0 15px 30px
        rgba(32,27,27,.16);
}

.btn-secondary{

    background:
        rgba(255,255,255,.65);

    border:
        1px solid
        var(--border);

    color:var(--ink);
}

.btn-secondary:hover{

    transform:translateY(-3px);

    box-shadow:var(--shadow-small);
}

.hero-image{

    position:relative;

    aspect-ratio:4 / 5;

    overflow:hidden;

    border-radius:38px;

    box-shadow:
        0 35px 90px
        rgba(63,44,39,.16);
}

.hero-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    transition:
        transform 1s var(--ease);
}

.hero-image:hover img{

    transform:scale(1.035);
}

.hero-image::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            transparent 45%,
            rgba(32,27,27,.35)
        );
}

.hero-badge{

    position:absolute;

    z-index:2;

    left:22px;
    bottom:22px;

    padding:16px 18px;

    border:
        1px solid
        rgba(255,255,255,.7);

    border-radius:18px;

    background:
        rgba(255,255,255,.84);

    backdrop-filter:blur(18px);

    box-shadow:
        0 18px 40px
        rgba(35,24,21,.15);
}

.hero-badge strong{

    display:block;

    font-size:12px;
}

.hero-badge span{

    display:block;

    margin-top:4px;

    color:var(--muted);

    font-size:9px;
}


/* =========================================================
   BOOKING INTRO
   ========================================================= */

.booking-intro{

    padding-bottom:45px;

    text-align:center;
}

.booking-intro .eyebrow{

    justify-content:center;
}

.booking-intro .section-description{

    margin-left:auto;
    margin-right:auto;
}


/* =========================================================
   PROGRESS
   ========================================================= */

.progress{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:0;

    margin-bottom:35px;
}

.progress-step{

    display:flex;

    align-items:center;
}

.progress-number{

    width:32px;
    height:32px;

    display:grid;
    place-items:center;

    border-radius:50%;

    border:
        1px solid
        var(--border);

    background:#fff;

    color:var(--muted-2);

    font-size:10px;
    font-weight:800;

    transition:.3s var(--ease);
}

.progress-step.active .progress-number{

    background:var(--ink);

    color:#fff;

    border-color:var(--ink);
}

.progress-step.done .progress-number{

    background:var(--rose);

    color:#fff;

    border-color:var(--rose);
}

.progress-line{

    width:45px;
    height:1px;

    background:var(--border);

    transition:.4s ease;
}

.progress-line.done{

    background:var(--rose);
}


/* =========================================================
   BOOKING WRAPPER
   ========================================================= */

.booking-layout{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        340px;

    gap:25px;

    align-items:start;
}

.booking-panel{

    min-width:0;

    padding:27px;

    border:
        1px solid
        rgba(255,255,255,.92);

    border-radius:30px;

    background:
        rgba(255,255,255,.72);

    box-shadow:var(--shadow);

    backdrop-filter:blur(18px);
}


/* =========================================================
   PROGRESSIVE STEPS
   ========================================================= */

.step-section{

    display:none;

    animation:
        revealStep .55s var(--ease) both;
}

.step-section.visible{
    display:block;
}

@keyframes revealStep{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.step-header{

    display:flex;

    align-items:flex-start;

    gap:13px;

    margin-bottom:23px;
}

.step-icon{

    width:38px;
    height:38px;

    flex:0 0 38px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #f0dfdc,
            #ead0cc
        );

    color:var(--rose-dark);

    font-size:12px;
    font-weight:800;
}

.step-header h3{

    margin:0;

    font-size:18px;

    letter-spacing:-.025em;
}

.step-header p{

    margin:5px 0 0;

    color:var(--muted);

    font-size:11px;
}


/* =========================================================
   SELECTED SUMMARY
   ========================================================= */

.completed-summary{

    display:none;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;

    padding:13px 15px;

    border-radius:14px;

    background:#f8f2ef;

    border:
        1px solid
        rgba(157,102,104,.09);
}

.completed-summary.visible{

    display:flex;
}

.completed-summary-content{

    min-width:0;
}

.completed-summary-label{

    display:block;

    color:var(--muted-2);

    font-size:8px;

    text-transform:uppercase;

    letter-spacing:.12em;
}

.completed-summary-value{

    display:block;

    margin-top:3px;

    color:var(--ink);

    font-size:12px;
    font-weight:700;

    overflow-wrap:anywhere;
}

.edit-button{

    flex:0 0 auto;

    border:0;

    background:none;

    color:var(--rose-dark);

    font-size:10px;
    font-weight:750;
}


/* =========================================================
   BARBER CARDS
   ========================================================= */

.barber-grid{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );

    gap:11px;
}

.barber-card{

    position:relative;

    padding:8px;

    border:
        1px solid
        var(--border);

    border-radius:21px;

    background:
        rgba(255,255,255,.68);

    transition:
        transform .25s var(--ease),
        border-color .25s ease,
        box-shadow .25s ease;
}

.barber-card:hover{

    transform:translateY(-3px);
}

.barber-card.selected{

    border-color:var(--rose-dark);

    box-shadow:
        0 13px 30px
        rgba(157,102,104,.13);
}

.barber-card img{

    width:100%;

    aspect-ratio:1 / 1.1;

    object-fit:cover;

    border-radius:15px;
}

.barber-info{

    padding:
        11px
        4px
        5px;
}

.barber-info strong{

    display:block;

    font-size:12px;
}

.barber-info span{

    display:block;

    margin-top:4px;

    color:var(--muted-2);

    font-size:9px;
}

.card-check{

    position:absolute;

    top:15px;
    right:15px;

    width:25px;
    height:25px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:var(--ink);

    color:white;

    font-size:10px;

    opacity:0;

    transform:scale(.7);

    transition:.25s var(--ease);
}

.barber-card.selected .card-check{

    opacity:1;

    transform:scale(1);
}


/* =========================================================
   SERVICE CARDS
   ========================================================= */

.service-grid{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:11px;
}

.service-card{

    position:relative;

    padding:18px;

    text-align:left;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    background:
        rgba(255,255,255,.62);

    transition:
        transform .25s var(--ease),
        border-color .25s ease,
        background .25s ease;
}

.service-card:hover{

    transform:translateY(-2px);
}

.service-card.selected{

    border-color:var(--rose-dark);

    background:
        linear-gradient(
            145deg,
            #f9eeeb,
            #fff
        );
}

.service-row{

    display:flex;

    justify-content:space-between;

    gap:10px;
}

.service-name{

    font-size:13px;
    font-weight:750;
}

.service-price{

    color:var(--rose-dark);

    font-size:12px;
    font-weight:800;

    white-space:nowrap;
}

.service-desc{

    margin:7px 0 13px;

    color:var(--muted);

    font-size:10px;

    line-height:1.55;
}

.service-bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.service-time{

    color:var(--muted-2);

    font-size:9px;
}

.select-circle{

    width:26px;
    height:26px;

    display:grid;
    place-items:center;

    border:
        1px solid
        var(--border);

    border-radius:50%;

    background:#fff;

    color:transparent;

    font-size:10px;

    transition:.2s ease;
}

.service-card.selected .select-circle{

    background:var(--ink);

    color:white;

    border-color:var(--ink);
}


/* =========================================================
   EXTRAS
   ========================================================= */

.extra-grid{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:10px;
}

.extra-card{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:16px;

    border:
        1px solid
        var(--border);

    border-radius:17px;

    background:
        rgba(255,255,255,.62);

    transition:.25s var(--ease);
}

.extra-card:hover{

    transform:translateY(-2px);
}

.extra-card.selected{

    border-color:var(--rose-dark);

    background:#fbf1ef;
}

.extra-info strong{

    display:block;

    font-size:12px;
}

.extra-info span{

    display:block;

    margin-top:4px;

    color:var(--muted);

    font-size:9px;
}

.extra-price{

    color:var(--rose-dark);

    font-size:11px;
    font-weight:800;

    white-space:nowrap;
}


/* =========================================================
   PRODUCT
   ========================================================= */

.product-grid{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:11px;
}

.product-card{

    overflow:hidden;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    background:
        rgba(255,255,255,.65);
}

.product-card img{

    width:100%;

    aspect-ratio:1;

    object-fit:cover;
}

.product-content{

    padding:13px;
}

.product-content strong{

    display:block;

    font-size:11px;
}

.product-content p{

    margin:5px 0 11px;

    color:var(--muted-2);

    font-size:8px;
}

.product-bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;
}

.product-price{

    font-size:11px;
    font-weight:800;
}

.quantity{

    display:flex;

    align-items:center;

    gap:7px;
}

.quantity button{

    width:25px;
    height:25px;

    border:
        1px solid
        var(--border);

    border-radius:50%;

    background:#fff;

    display:grid;
    place-items:center;

    font-size:12px;
}

.quantity span{

    min-width:12px;

    text-align:center;

    font-size:10px;
    font-weight:800;
}


/* =========================================================
   CONTINUE BUTTONS
   ========================================================= */

.step-actions{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;
}

.continue-button{

    min-height:45px;

    padding:
        0 20px;

    border:0;

    border-radius:13px;

    background:var(--ink);

    color:#fff;

    font-size:10px;
    font-weight:800;

    transition:.25s var(--ease);
}

.continue-button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 25px
        rgba(32,27,27,.14);
}

.skip-button{

    min-height:45px;

    padding:
        0 15px;

    border:1px solid var(--border);

    border-radius:13px;

    background:white;

    color:var(--muted);

    font-size:10px;
    font-weight:700;
}


/* =========================================================
   DATE
   ========================================================= */

.date-grid{

    display:grid;

    grid-template-columns:
        repeat(
            7,
            minmax(0,1fr)
        );

    gap:7px;
}

.date-button{

    padding:
        13px
        7px;

    border:
        1px solid
        var(--border);

    border-radius:14px;

    background:#fff;

    transition:.25s var(--ease);
}

.date-button span{

    display:block;

    color:var(--muted-2);

    font-size:8px;

    text-transform:uppercase;
}

.date-button strong{

    display:block;

    margin-top:4px;

    font-size:16px;
}

.date-button.selected{

    background:var(--ink);

    color:white;

    border-color:var(--ink);

    box-shadow:
        0 10px 23px
        rgba(32,27,27,.13);
}

.date-button.selected span{

    color:#aaa19d;
}


/* =========================================================
   TIME
   ========================================================= */

.time-grid{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );

    gap:8px;
}

.time-button{

    min-height:43px;

    border:
        1px solid
        var(--border);

    border-radius:12px;

    background:white;

    color:var(--ink);

    font-size:10px;
    font-weight:700;

    transition:.2s ease;
}

.time-button:hover:not(:disabled){

    border-color:var(--rose-dark);
}

.time-button.selected{

    background:var(--rose-dark);

    color:white;

    border-color:var(--rose-dark);
}

.time-button:disabled{

    opacity:.35;

    text-decoration:line-through;

    cursor:not-allowed;
}


/* =========================================================
   FORM
   ========================================================= */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:12px;
}

.form-group{

    display:flex;

    flex-direction:column;

    gap:7px;
}

.form-group.full{

    grid-column:1 / -1;
}

.form-group label{

    font-size:10px;
    font-weight:750;
}

.form-group input,
.form-group textarea{

    width:100%;

    border:
        1px solid
        var(--border);

    border-radius:13px;

    padding:
        13px
        14px;

    background:
        rgba(255,255,255,.7);

    color:var(--ink);

    outline:none;

    transition:.2s ease;
}

.form-group textarea{

    min-height:95px;

    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{

    border-color:var(--rose-dark);

    box-shadow:
        0 0 0 4px
        rgba(157,102,104,.07);
}


/* =========================================================
   SUMMARY
   ========================================================= */

.summary{

    position:sticky;

    top:90px;

    padding:24px;

    border-radius:27px;

    background:var(--ink);

    color:#fff;

    box-shadow:
        0 28px 65px
        rgba(32,27,27,.20);

    overflow:hidden;
}

.summary::before{

    content:"";

    position:absolute;

    width:240px;
    height:240px;

    right:-130px;
    top:-120px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(216,184,180,.22),
            transparent 68%
        );
}

.summary-top{

    position:relative;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.summary-title{

    color:#b7aeaa;

    font-size:9px;

    letter-spacing:.17em;

    text-transform:uppercase;
}

.summary-live{

    display:flex;

    align-items:center;

    gap:6px;

    color:#8f9d91;

    font-size:8px;
}

.summary-live i{

    width:5px;
    height:5px;

    border-radius:50%;

    background:#78917e;
}

.summary-content{

    position:relative;

    margin-top:19px;
}

.summary-empty{

    padding:
        25px
        0;

    color:#77706d;

    font-size:10px;

    line-height:1.6;
}

.summary-section{

    padding:
        11px
        0;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.summary-label{

    color:#77706d;

    font-size:8px;

    text-transform:uppercase;

    letter-spacing:.1em;
}

.summary-value{

    margin-top:4px;

    font-size:11px;
    font-weight:650;
}

.summary-services{

    margin-top:7px;
}

.summary-service{

    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:5px;

    color:#aaa19d;

    font-size:9px;
}

.summary-total{

    display:flex;

    align-items:end;

    justify-content:space-between;

    margin-top:19px;
}

.summary-total span{

    color:#77706d;

    font-size:9px;
}

.summary-total strong{

    font-size:27px;

    letter-spacing:-.04em;
}

.whatsapp-button{

    width:100%;

    margin-top:17px;

    padding:14px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ead8bd,
            #c5a170
        );

    color:#261f1a;

    font-size:10px;
    font-weight:850;

    transition:.25s var(--ease);
}

.whatsapp-button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 25px
        rgba(197,161,112,.20);
}

.summary-note{

    margin-top:11px;

    text-align:center;

    color:#6f6865;

    font-size:8px;

    line-height:1.5;
}


/* =========================================================
   LOCATION
   ========================================================= */

.location{

    background:#eee6e2;
}

.location-grid{

    display:grid;

    grid-template-columns:
        .85fr
        1.15fr;

    gap:25px;
}

.location-card{

    padding:35px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #f7efeb
        );

    box-shadow:var(--shadow-small);
}

.location-card h3{

    margin:0;

    font-size:28px;

    letter-spacing:-.04em;
}

.location-card p{

    color:var(--muted);

    font-size:12px;

    line-height:1.7;
}

.location-details{

    display:grid;

    gap:16px;

    margin-top:25px;
}

.location-item{

    display:flex;

    gap:11px;
}

.location-icon{

    width:34px;
    height:34px;

    flex:0 0 34px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:var(--rose-soft);

    color:var(--rose-dark);
}

.location-item strong{

    display:block;

    font-size:11px;
}

.location-item span{

    display:block;

    margin-top:3px;

    color:var(--muted-2);

    font-size:9px;
}

.map{

    min-height:400px;

    overflow:hidden;

    border-radius:28px;

    box-shadow:var(--shadow);
}

.map iframe{

    width:100%;
    height:100%;

    min-height:400px;

    border:0;

    filter:
        saturate(.7)
        sepia(.08);
}


/* =========================================================
   FOOTER
   ========================================================= */

footer{

    padding:
        50px
        0
        30px;

    background:#181515;

    color:#fff;
}

.footer-grid{

    display:grid;

    grid-template-columns:
        1.5fr
        1fr
        1fr;

    gap:35px;
}

.footer-brand{

    font-size:16px;

    font-weight:800;

    letter-spacing:.09em;
}

.footer-description{

    max-width:330px;

    margin-top:11px;

    color:#7e7774;

    font-size:10px;

    line-height:1.7;
}

.footer-column h4{

    margin:0 0 12px;

    color:#c9c0bc;

    font-size:9px;

    letter-spacing:.13em;

    text-transform:uppercase;
}

.footer-column a{

    display:block;

    margin:8px 0;

    color:#817a77;

    font-size:10px;
}

.footer-bottom{

    display:flex;

    justify-content:space-between;

    gap:20px;

    margin-top:45px;

    padding-top:18px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

    color:#625c59;

    font-size:8px;
}


/* =========================================================
   MOBILE SUMMARY
   ========================================================= */

.mobile-summary{

    display:none;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast{

    position:fixed;

    z-index:3000;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    width:
        min(
            420px,
            calc(100% - 30px)
        );

    padding:13px 17px;

    border-radius:14px;

    background:var(--ink);

    color:white;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.22);

    font-size:10px;

    text-align:center;

    transition:.3s var(--ease);
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:1000px){

    .hero-grid{

        grid-template-columns:1fr;

        gap:40px;
    }

    .hero-copy{

        text-align:center;
    }

    .hero-text{

        margin-left:auto;
        margin-right:auto;
    }

    .hero-actions{

        justify-content:center;
    }

    .hero-image{

        width:min(650px,100%);

        margin:auto;
    }

    .booking-layout{

        grid-template-columns:1fr;
    }

    .summary{

        position:relative;

        top:auto;
    }

    .barber-grid{

        grid-template-columns:
            repeat(
                4,
                minmax(0,1fr)
            );
    }

}
